name: Monitor charging prices

on:
  schedule:
    - cron: '7,37 * * * *'   # каждые 30 минут (UTC), GitHub может запускать с задержкой
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: charge-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tests
        run: python -m unittest discover -s scripts

      - name: Fetch prices
        run: python scripts/parser.py
        env:
          SPIRII_CUSTOMER_IDS: ${{ vars.SPIRII_CUSTOMER_IDS }}
          SPIRII_CPO_ID: ${{ vars.SPIRII_CPO_ID }}

      # На сайт публикуется только текущий снимок docs/data/latest.json.
      # История копится на телефоне пользователя (localStorage), сервер её не хранит.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
