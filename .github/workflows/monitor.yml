name: Monitor charging prices

on:
  schedule:
    - cron: '7,37 * * * *'   # каждые 30 минут (UTC), GitHub может запускать с задержкой
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write   # push в ветку data
  pages: write
  id-token: write

concurrency:
  group: charge-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tests
        run: python -m unittest discover -s scripts

      # История хранится в ветке `data` (один коммит, перезаписывается),
      # чтобы main не раздувался от 48 коммитов в сутки.
      - name: Restore history from data branch
        run: |
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:history.json > docs/data/history.json
            echo "History restored: $(wc -c < docs/data/history.json) bytes"
          elif [ "$code" = "2" ]; then
            echo "No data branch yet — starting fresh history"
          else
            echo "Cannot reach remote (exit $code) — refusing to overwrite history"
            exit 1
          fi

      - name: Fetch prices
        run: python scripts/parser.py
        env:
          SPIRII_CUSTOMER_IDS: ${{ vars.SPIRII_CUSTOMER_IDS }}
          SPIRII_CPO_ID: ${{ vars.SPIRII_CPO_ID }}

      - name: Save history to data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/data
          git init -q -b data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json history.json
          git commit -q -m "Data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          rm -rf .git

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
