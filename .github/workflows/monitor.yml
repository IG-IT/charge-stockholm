name: Monitor charging prices

on:
  schedule:
    - cron: '7,37 * * * *'   # каждые 30 минут (UTC), GitHub может запускать с задержкой
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: charge-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tests
        run: python -m unittest discover -s scripts

      - id: pages
        uses: actions/configure-pages@v6

      # Прошлые 7 дней берутся из уже опубликованного latest.json.
      - name: Fetch prices
        run: python scripts/parser.py
        env:
          PREVIOUS_LATEST_URL: ${{ steps.pages.outputs.base_url }}/data/latest.json
          SPIRII_CUSTOMER_IDS: ${{ vars.SPIRII_CUSTOMER_IDS }}
          SPIRII_CPO_ID: ${{ vars.SPIRII_CPO_ID }}

      # На сайт публикуется latest.json: текущий снимок + скользящие 7 дней.
      # Полная история копится только на телефоне (localStorage).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      # deploy-pages иногда падает из-за временных сбоев GitHub — одна повторная попытка.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
